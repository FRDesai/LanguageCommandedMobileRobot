# Changes to TurtleBot3's stock Nav2 parameters (turtlebot3_navigation2/param/humble/<model>.yaml).
# bringup.launch.py applies these on top of the stock file; anything not listed keeps its stock value.
# Each change and its measured effect is recorded in the README.
controller_server:
  ros__parameters:
    FollowPath:
      # Stock 2.0. The controller steers towards the point where the path leaves this radius. At 2.0
      # (in effect 1.5, the edge of its local map) that point lies across the wall on a hairpin turn
      # round a wall end, and the robot stops facing the wall. At 1.0 it stays on the robot's side.
      forward_prune_distance: 1.0
